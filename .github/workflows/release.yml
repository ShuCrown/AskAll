name: Build & Release (Extension + Desktop)

# 触发方式：
#   1. push 到 main 分支（任意文件改动）时，自动构建并创建 draft Release
#   2. 手动触发：在 Actions 页面点击 "Run workflow" 重新构建
# 说明：创建的 Release 一律为草稿（draft），确认无误后需在 GitHub 页面手动发布
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_FILE: version.json

jobs:
  # ============================================================
  # 提取版本 / 更新说明 / 自上一版本 tag 以来的提交记录
  # ============================================================
  prepare:
    name: Read version & notes & changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.VERSION }}
      notes_zh: ${{ steps.read.outputs.NOTES_ZH }}
      notes_en: ${{ steps.read.outputs.NOTES_EN }}
      changes: ${{ steps.read.outputs.CHANGES }}
      tag: ${{ steps.read.outputs.TAG }}
    steps:
      # fetch-depth: 0 拉取全部历史与 tag，用于生成自上一版本以来的提交记录
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version.json & changelog
        id: read
        run: |
          version=$(jq -r '.version' "$VERSION_FILE")
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "TAG=v$version" >> "$GITHUB_OUTPUT"

          # 自上一版本 tag 以来的提交记录；尚无 tag 时取最近 30 条
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$last_tag" ]; then
            changes=$(git log "$last_tag"..HEAD --oneline --no-merges)
          else
            changes=$(git log --oneline --no-merges -n 30)
          fi
          if [ -z "$changes" ]; then
            changes="（当前版本无新提交）"
          fi

          # 多行内容必须使用 heredoc 分隔符语法，否则 GITHUB_OUTPUT 报 "Invalid format"
          {
            echo "NOTES_ZH<<ASKALL_EOF"
            jq -r '.release_notes["zh-CN"]' "$VERSION_FILE"
            echo "ASKALL_EOF"
            echo "NOTES_EN<<ASKALL_EOF"
            jq -r '.release_notes.en' "$VERSION_FILE"
            echo "ASKALL_EOF"
            echo "CHANGES<<ASKALL_EOF"
            printf '%s\n' "$changes"
            echo "ASKALL_EOF"
          } >> "$GITHUB_OUTPUT"

  # ============================================================
  # 打包浏览器扩展（Chrome + Firefox）
  # ============================================================
  build:
    name: Build extension ${{ matrix.browser }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # 由 package.json 的 packageManager 字段（pnpm@10.5.2）自动安装 pnpm，
      # 不在此显式指定 version，避免与 packageManager 冲突（ERR_PNPM_BAD_PM_VERSION）
      # 必须放在 setup-node 之前：行动自身需要 node 解析 packageManager 字段
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 用 version.json 覆盖 WXT（扩展子包 apps/extension/package.json）的版本号。
      # 注意：必须改 apps/extension/package.json，WXT 读取的是扩展子包的 version，
      # 而非 monorepo 根 package.json，否则打出来的扩展版本永远是 1.0.0。
      - name: Sync version (extension)
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('apps/extension/package.json'));p.version=process.env.VERSION;fs.writeFileSync('apps/extension/package.json',JSON.stringify(p,null,2)+'\n')"
          cat apps/extension/package.json | grep version

      # WXT 只安装在 apps/extension 子包中，必须用 --filter 限定到该包，
      # 否则 pnpm 会在 workspace 根递归执行 wxt 并报 ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL。
      - name: Build (${{ matrix.browser }})
        run: pnpm --filter @askall/extension zip -b ${{ matrix.browser }} --mode production

      # wxt 经 --filter @askall/extension 在子包目录内执行，产物落在
      # apps/extension/.output/（而非仓库根 .output/），故此处路径须对应子包目录。
      - name: Locate & rename zip
        env:
          OUT_DIR: apps/extension/.output
        run: |
          if ! ls "$OUT_DIR"/*.zip >/dev/null 2>&1; then
            echo "::error::No zip file found in $OUT_DIR/. Listing contents:"
            ls -la "$OUT_DIR" || true
            ls -la apps/extension || true
            exit 1
          fi
          zip_file=$(ls "$OUT_DIR"/*.zip | head -n1)
          target="$OUT_DIR/askall-${{ env.VERSION }}-${{ matrix.browser }}.zip"
          echo "Found zip: $zip_file"
          # 仅当文件名与目标不一致时才重命名，避免 mv 同名文件报错
          if [ "$zip_file" != "$target" ]; then
            mv "$zip_file" "$target"
            echo "Renamed to: $target"
          else
            echo "Zip already named correctly: $target"
          fi
          ls -la "$OUT_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: extension-${{ matrix.browser }}-${{ env.VERSION }}
          path: apps/extension/.output/askall-${{ env.VERSION }}-${{ matrix.browser }}.zip
          if-no-files-found: error

  # ============================================================
  # 打包桌面端（Tauri）：macOS + Windows
  # 产物：macOS .dmg / .app.zip；Windows .msi / .exe
  # 说明：桌面端未配置签名证书，产物为未签名安装包，适合草稿 Release 内测分发
  # ============================================================
  desktop:
    name: Build desktop ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      # Rust 工具链 + 增量缓存（首次冷编译约 10-20 分钟，缓存后大幅提速）
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同步版本：Tauri 打包版本取自 tauri.conf.json 的 version 字段，
      # 同时同步 package.json / Cargo.toml，避免三者不一致。
      - name: Sync version (desktop)
        shell: bash
        run: |
          node -e "
          const fs=require('fs');
          const v=process.env.VERSION;
          const pkg=JSON.parse(fs.readFileSync('apps/desktop/package.json'));
          pkg.version=v; fs.writeFileSync('apps/desktop/package.json',JSON.stringify(pkg,null,2)+'\n');
          const conf=JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json'));
          conf.version=v; fs.writeFileSync('apps/desktop/src-tauri/tauri.conf.json',JSON.stringify(conf,null,2)+'\n');
          const cargo=fs.readFileSync('apps/desktop/src-tauri/Cargo.toml','utf8');
          fs.writeFileSync('apps/desktop/src-tauri/Cargo.toml', cargo.replace(/^version = \".*\"$/m, 'version = \"'+v+'\"'));
          "
          grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json

      # beforeBuildCommand（pnpm build）会在 apps/desktop 内执行，无需额外处理
      - name: Build (${{ matrix.os }})
        run: pnpm --filter @askall/desktop tauri build

      # 把 bundle 各子目录（macos/nsis/msi/dmg…）的安装包文件摊平到 desktop-dist/，
      # macOS 的 .app 目录压缩为 zip，避免 Release 上传目录被展开成几百个文件。
      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          ROOT="$PWD"
          BUNDLE="apps/desktop/src-tauri/target/release/bundle"
          DIST="desktop-dist"
          rm -rf "$DIST" && mkdir -p "$DIST"
          # 安装包文件直接拷贝（Windows .msi/.exe；macOS .dmg）
          find "$BUNDLE" -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} "$DIST/" \;
          # macOS .app 目录压缩为 zip
          app_dir=$(find "$BUNDLE" -maxdepth 2 -type d -name "*.app" | head -n1 || true)
          if [ -n "$app_dir" ]; then
            (cd "$(dirname "$app_dir")" && zip -rq "$ROOT/$DIST/$(basename "$app_dir").zip" "$(basename "$app_dir")")
          fi
          ls -la "$DIST"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.os }}-${{ env.VERSION }}
          path: desktop-dist
          if-no-files-found: error

  # ============================================================
  # 创建 GitHub Release（始终为草稿 draft，需手动发布）
  # 包含：扩展产物（chrome/firefox zip）+ 桌面端产物（macOS/Windows 安装包）
  # ============================================================
  release:
    name: Create draft GitHub Release
    needs: [prepare, build, desktop]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # gh release 需要在 git 仓库上下文操作（创建 tag 等），必须先 checkout
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Write release notes
        run: |
          # 多行内容用带引号的 heredoc 写入；模板表达式在步骤执行前已被 GitHub 替换，
          # 因此嵌套的 notes / changes 多行内容可以正常写入
          cat > RELEASE_NOTES.md <<'ASKALL_NOTES_EOF_7f3a'
          # AskAll 齐问 v${{ needs.prepare.outputs.version }}

          ## 🚀 本次升级内容（zh-CN）

          ${{ needs.prepare.outputs.notes_zh }}

          ## 📦 提交记录（自上一版本以来）

          ${{ needs.prepare.outputs.changes }}

          ## 产物清单（Artifacts）

          - 浏览器扩展：Chrome / Firefox（zip）
          - 桌面端（macOS）：.dmg / .app.zip
          - 桌面端（Windows）：.msi / .exe

          ---

          ## What's Changed (English)

          ${{ needs.prepare.outputs.notes_en }}
          ASKALL_NOTES_EOF_7f3a

      # 每次构建都生成/更新 draft 草稿；已正式发布的 release 不做改动
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 收集全部已下载的产物文件（desktop 产物已摊平为文件，无目录展开问题）
          mapfile -t files < <(find artifacts -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No artifact files found"
            exit 1
          fi
          echo "Uploading ${#files[@]} file(s):"
          printf '%s\n' "${files[@]}"

          # uploaded=1 表示本次确实执行了上传，随后需要校验产物完整性
          uploaded=0
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$is_draft" = "true" ]; then
              echo "Draft release $TAG 已存在，更新附件与说明…"
              gh release upload "$TAG" "${files[@]}" --clobber
              gh release edit "$TAG" \
                --title "AskAll 齐问 v$VERSION" \
                --notes-file RELEASE_NOTES.md \
                --draft
              uploaded=1
            else
              echo "Release $TAG 已正式发布，跳过自动更新"
            fi
          else
            echo "创建新 draft release $TAG …"
            gh release create "$TAG" \
              --title "AskAll 齐问 v$VERSION" \
              --notes-file RELEASE_NOTES.md \
              --draft \
              "${files[@]}"
            uploaded=1
          fi

          # 上传后校验：逐一确认本地产物都已出现在 release assets 中，防止静默丢失
          if [ "$uploaded" = "1" ]; then
            echo "=== 校验产物是否全部上传成功 ==="
            gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/release_assets.txt
            missing=0
            for f in "${files[@]}"; do
              base=$(basename "$f")
              if ! grep -qxF "$base" /tmp/release_assets.txt; then
                echo "::error::Release 缺少产物: $base"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "::error::产物上传校验失败，请检查上面的缺失列表"
              echo "当前 Release assets："
              cat /tmp/release_assets.txt
              exit 1
            fi
            echo "校验通过：${#files[@]} 个产物均已上传到 Release $TAG"
          fi
