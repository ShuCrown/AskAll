name: Build & Release Extension

# 触发方式：
#   1. push 到 main 分支（任意文件改动）时，自动构建并创建 draft Release
#   2. 手动触发：在 Actions 页面点击 "Run workflow" 重新构建
# 说明：创建的 Release 一律为草稿（draft），确认无误后需在 GitHub 页面手动发布
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_FILE: version.json

jobs:
  # ============================================================
  # 提取版本与更新内容
  # ============================================================
  prepare:
    name: Read version & notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.VERSION }}
      notes_zh: ${{ steps.read.outputs.NOTES_ZH }}
      notes_en: ${{ steps.read.outputs.NOTES_EN }}
      tag: ${{ steps.read.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version.json
        id: read
        run: |
          version=$(jq -r '.version' "$VERSION_FILE")
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "TAG=v$version" >> "$GITHUB_OUTPUT"
          # 多行内容必须使用 heredoc 分隔符语法，否则 GITHUB_OUTPUT 报 "Invalid format"
          {
            echo "NOTES_ZH<<ASKALL_EOF"
            jq -r '.release_notes["zh-CN"]' "$VERSION_FILE"
            echo "ASKALL_EOF"
            echo "NOTES_EN<<ASKALL_EOF"
            jq -r '.release_notes.en' "$VERSION_FILE"
            echo "ASKALL_EOF"
          } >> "$GITHUB_OUTPUT"

  # ============================================================
  # 打包 Chrome 与 Firefox（不依赖任何插件平台账号）
  # ============================================================
  build:
    name: Build & package ${{ matrix.browser }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 用 version.json 覆盖 package.json / WXT 的版本号
      - name: Sync version
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "$VERSION" > .version
          cat package.json | grep version
          ls -la

      - name: Build (${{ matrix.browser }})
        run: pnpm wxt zip -b ${{ matrix.browser }} --mode production

      # 定位实际生成的 zip（无论 wxt 默认命名成什么），校验存在后重命名为固定名称，
      # 避免 .output/*.zip 通配符匹配不到或匹配不一致的问题
      - name: Locate & rename zip
        run: |
          if ! ls .output/*.zip >/dev/null 2>&1; then
            echo "::error::No zip file found in .output/. Listing contents:"
            ls -la .output/
            exit 1
          fi
          zip_file=$(ls .output/*.zip | head -n1)
          target=".output/askall-${{ env.VERSION }}-${{ matrix.browser }}.zip"
          echo "Found zip: $zip_file"
          # 仅当文件名与目标不一致时才重命名，避免 mv 同名文件报错
          if [ "$zip_file" != "$target" ]; then
            mv "$zip_file" "$target"
            echo "Renamed to: $target"
          else
            echo "Zip already named correctly: $target"
          fi
          ls -la .output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}-${{ env.VERSION }}
          path: .output/askall-${{ env.VERSION }}-${{ matrix.browser }}.zip
          if-no-files-found: error

  # ============================================================
  # 创建 GitHub Release（始终为草稿 draft，需手动发布）
  # ============================================================
  release:
    name: Create draft GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write release notes
        run: |
          # 多行内容用带引号的 heredoc 写入，避免变量展开与格式问题
          cat > RELEASE_NOTES.md <<'ASKALL_NOTES_EOF_7f3a'
          ## zh-CN
          ${{ needs.prepare.outputs.notes_zh }}

          ## English
          ${{ needs.prepare.outputs.notes_en }}
          ASKALL_NOTES_EOF_7f3a

      # 每次构建都生成/更新 draft 草稿；已正式发布的 release 不做改动
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$is_draft" = "true" ]; then
              echo "Draft release $TAG 已存在，更新附件与说明…"
              gh release upload "$TAG" artifacts/**/*.zip --clobber
              gh release edit "$TAG" \
                --title "v$VERSION" \
                --notes-file RELEASE_NOTES.md \
                --draft
            else
              echo "Release $TAG 已正式发布，跳过自动更新"
            fi
          else
            echo "创建新 draft release $TAG …"
            gh release create "$TAG" \
              --title "v$VERSION" \
              --notes-file RELEASE_NOTES.md \
              --draft \
              artifacts/**/*.zip
          fi